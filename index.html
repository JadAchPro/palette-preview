<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Palette Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, system-ui, sans-serif; background: #E8ECF0; padding: 48px 24px 80px; color: #1a1a1a; }
  .page-title { text-align: center; font-size: 28px; font-weight: 800; margin-bottom: 6px; }
  .page-sub { text-align: center; font-size: 14px; color: #666; margin-bottom: 48px; }

  .palette-section { max-width: 1100px; margin: 0 auto 64px; }
  .palette-header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .palette-number { font-size: 13px; font-weight: 800; color: white; background: #1a1a1a; width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .palette-name-input { font-size: 22px; font-weight: 800; font-family: inherit; border: none; background: transparent; outline: none; border-bottom: 2px solid transparent; padding: 0 0 2px; }
  .palette-name-input:hover { border-bottom-color: #ccc; }
  .palette-name-input:focus { border-bottom-color: #635BFF; }
  .palette-mood { font-size: 13px; color: #888; font-weight: 500; }
  .palette-count-badge { font-size: 11px; font-weight: 700; color: #425466; background: #F0F3F7; border-radius: 6px; padding: 3px 10px; margin-left: auto; flex-shrink: 0; }

  /* ── Swatch row + controls ── */
  .swatch-wrapper { display: flex; align-items: stretch; gap: 8px; }
  .palette-row { display: flex; gap: 0; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06); height: 110px; flex: 1; min-width: 0; }
  .swatch-controls { display: flex; flex-direction: column; gap: 4px; justify-content: center; flex-shrink: 0; height: 110px; }
  .swatch-btn { width: 34px; flex: 1; border-radius: 8px; border: 2px solid #DDE3EB; background: white; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; font-size: 16px; font-weight: 700; color: #425466; line-height: 1; }
  .swatch-btn:hover { border-color: #635BFF; color: #635BFF; background: rgba(99,91,255,0.04); }
  .swatch-btn:active { transform: scale(0.92); }
  .swatch-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: #E8ECF0; color: #ccc; }
  .swatch-btn:disabled:hover { border-color: #E8ECF0; color: #ccc; background: white; }

  .color-block { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 12px; position: relative; cursor: pointer; transition: flex 0.3s, filter 0.2s; min-width: 0; }
  .color-block:first-child { flex: 1.6; }
  .color-block:hover { filter: brightness(1.08); }
  .color-block input[type="color"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: none; }
  .color-label { font-size: 10px; font-weight: 700; pointer-events: none; position: relative; z-index: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .color-hex { font-size: 9px; font-weight: 600; font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; pointer-events: none; position: relative; z-index: 1; opacity: 0.8; }
  .color-block .color-label, .color-block .color-hex { color: white; }
  .color-block.dark-text .color-label, .color-block.dark-text .color-hex { color: #1a1a1a; }
  .click-hint { position: absolute; top: 6px; right: 6px; font-size: 7px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 1; color: white; background: rgba(0,0,0,0.25); padding: 2px 5px; border-radius: 3px; }
  .color-block:hover .click-hint { opacity: 1; }

  /* ── Mini slide previews ── */
  .preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 16px; }
  .mini-slide { border-radius: 10px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); height: 220px; display: flex; flex-direction: column; }
  .mini-slide-header { padding: 12px 16px 8px; }
  .mini-slide-header h3 { font-size: 13px; font-weight: 800; margin-bottom: 2px; }
  .mini-slide-header p { font-size: 9px; opacity: 0.5; }
  .mini-slide-body { flex: 1; padding: 0 16px 12px; display: flex; flex-direction: column; gap: 5px; justify-content: center; overflow: hidden; }

  .mini-bar-row { display: flex; align-items: center; gap: 8px; }
  .mini-bar-label { font-size: 9px; font-weight: 600; width: 48px; text-align: right; opacity: 0.5; flex-shrink: 0; }
  .mini-bar-track { flex: 1; height: 9px; border-radius: 5px; overflow: hidden; background: #E8ECF0; }
  .mini-bar-fill { height: 100%; border-radius: 5px; transition: background-color 0.3s; }

  .mini-stat-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .mini-stat { flex: 1; min-width: 60px; border-radius: 8px; padding: 8px 6px; text-align: center; transition: background-color 0.3s; }
  .mini-stat-value { font-size: 16px; font-weight: 800; transition: color 0.3s; }
  .mini-stat-label { font-size: 7px; font-weight: 600; margin-top: 1px; transition: color 0.3s; }

  .mini-donut-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .mini-legend { display: flex; flex-direction: column; gap: 3px; }
  .mini-legend-item { display: flex; align-items: center; gap: 5px; font-size: 9px; font-weight: 600; }
  .mini-legend-dot { width: 7px; height: 7px; border-radius: 50%; transition: background-color 0.3s; flex-shrink: 0; }

  svg circle, svg polygon, svg line, svg rect { transition: all 0.3s; }

  /* ── Stacked bars ── */
  .stacked-row { display: flex; align-items: center; gap: 8px; }
  .stacked-label { font-size: 9px; font-weight: 600; width: 28px; text-align: right; opacity: 0.5; flex-shrink: 0; }
  .stacked-track { flex: 1; height: 14px; border-radius: 4px; overflow: hidden; display: flex; }
  .stacked-seg { height: 100%; transition: background-color 0.3s; }

  /* ── Radar ── */
  .radar-wrap { display: flex; align-items: center; justify-content: center; flex: 1; }
  .radar-wrap svg { overflow: visible; }

  /* ── Heatmap ── */
  .heatmap-grid { display: grid; gap: 3px; flex: 1; }
  .heatmap-cell { border-radius: 3px; transition: background-color 0.3s; min-height: 0; }
  .heatmap-col-label { font-size: 7px; font-weight: 700; text-align: center; opacity: 0.5; padding-bottom: 1px; }
  .heatmap-row-label { font-size: 7px; font-weight: 600; opacity: 0.4; display: flex; align-items: center; justify-content: flex-end; padding-right: 2px; }

  /* ── Export bar ── */
  .export-bar { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 10px 14px; background: white; border-radius: 10px; border: 1px solid #E6EBF1; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  .export-bar code { flex: 1; font-size: 11px; font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; color: #425466; white-space: nowrap; overflow-x: auto; padding: 4px 0; }
  .export-btn { padding: 6px 14px; font-size: 11px; font-weight: 700; font-family: inherit; border: none; border-radius: 6px; cursor: pointer; background: #0A2540; color: white; transition: background 0.2s; white-space: nowrap; }
  .export-btn:hover { background: #1a3a5c; }
  .export-btn.copied { background: #00D4AA; }

  @media (max-width: 900px) {
    .preview-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .preview-grid { grid-template-columns: 1fr; }
    .mini-slide { height: 200px; }
  }
</style>
</head>
<body>

<h1 class="page-title">Hissez vos couleurs</h1>
<p class="page-sub">Clique sur une couleur pour la modifier &bull; Utilise <strong>+</strong> / <strong>&minus;</strong> pour ajouter ou retirer des couleurs</p>

<div id="palettes"></div>

<script>
const PALETTES = [
  {
    name: 'Acier',
    mood: '',
    colors: [
      { hex: '#1A2A35', label: 'Nuit' },
      { hex: '#2D4A5C', label: 'Ardoise' },
      { hex: '#416680', label: 'Acier' },
      { hex: '#5A8BA8', label: 'Ciel' },
      { hex: '#7BABC8', label: 'Brume' },
      { hex: '#A5C7D8', label: 'Givre' }
    ]
  },
  {
    name: 'Carmin',
    mood: '',
    colors: [
      { hex: '#4A0415', label: 'Bordeaux' },
      { hex: '#8A0726', label: 'Grenat' },
      { hex: '#B20932', label: 'Carmin' },
      { hex: '#D4304F', label: 'Rose vif' },
      { hex: '#E8788E', label: 'Blush' },
      { hex: '#F5C0CA', label: 'P\u00e9tale' }
    ]
  },
  {
    name: 'Encre & Or',
    mood: '',
    colors: [
      { hex: '#111111', label: 'Encre' },
      { hex: '#2A2A2A', label: 'Charbon' },
      { hex: '#C8A45D', label: 'Or' },
      { hex: '#555555', label: 'Fum\u00e9e' },
      { hex: '#E8D5A3', label: 'Miel' },
      { hex: '#DAB96F', label: 'Laiton' }
    ]
  },
  {
    name: 'For\u00eat',
    mood: '',
    colors: [
      { hex: '#1A3328', label: 'For\u00eat noire' },
      { hex: '#2D5A42', label: 'Sapin' },
      { hex: '#3D7A5A', label: 'Mousse' },
      { hex: '#5A9E78', label: 'Jade' },
      { hex: '#8BC4A5', label: 'Menthe' },
      { hex: '#C2E0D0', label: 'Ros\u00e9e' }
    ]
  },
  {
    name: 'Oc\u00e9an & Corail',
    mood: '',
    colors: [
      { hex: '#0C2340', label: 'Abysse' },
      { hex: '#1A4070', label: 'Marine' },
      { hex: '#2D6BA0', label: 'Oc\u00e9an' },
      { hex: '#E8735A', label: 'Corail' },
      { hex: '#5A9AC8', label: 'Azur' },
      { hex: '#F2A898', label: 'Saumon' }
    ]
  }
];

const MIN_COLORS = 3;  // 1 primary + 2 accents
const MAX_COLORS = 10; // 1 primary + 9 accents

const BAR_LABELS = ['SEO','Social','Ads','Email','Events','PR','Affili\u00e9s','Direct','Partenaires'];
const BAR_WIDTHS_BASE = [85, 62, 48, 73, 35, 55, 42, 68, 30];
const STAT_VALUES = ['87%','+24','3.2x','\u20ac4.5k','12k','92%','x2.1','+38','\u20ac18k'];
const STAT_LABELS = ['Satisfaction','NPS','ROI','Panier','Visites','R\u00e9tention','Croissance','Leads','Revenue'];
const DEFAULT_NEW_LABELS = ['Accent','Cobalt','Magenta','Lime','Cuivre','Ivoire','Jade','Grenat','Azur'];

function hexToRgb(h) { return { r: parseInt(h.slice(1,3),16), g: parseInt(h.slice(3,5),16), b: parseInt(h.slice(5,7),16) }; }
function lighten(h, a) { const c = hexToRgb(h); return `rgb(${Math.min(255,c.r+a)},${Math.min(255,c.g+a)},${Math.min(255,c.b+a)})`; }
function rgba(h, a) { const c = hexToRgb(h); return `rgba(${c.r},${c.g},${c.b},${a})`; }
function lum(h) { const c = hexToRgb(h); return .299*c.r+.587*c.g+.114*c.b; }
function randHex() { return '#' + Array.from({length:6}, () => '0123456789ABCDEF'[Math.floor(Math.random()*16)]).join(''); }
// Readable text color on a white/light background: use primary if dark enough, else fallback
function textOnLight(primary) { return lum(primary) < 140 ? primary : '#1a1a1a'; }
// Readable text color on a colored background: white if bg is dark, else dark
function textOnBg(bg) { return lum(bg) < 140 ? '#ffffff' : '#1a1a1a'; }

function donutSegments(n) {
  // Generate somewhat uneven percentages that sum to 100
  const raw = Array.from({length: n}, (_, i) => Math.max(5, 30 - i * 4 + Math.round(Math.random() * 6)));
  const sum = raw.reduce((a, b) => a + b, 0);
  const pcts = raw.map(v => Math.round(v / sum * 100));
  // Fix rounding
  const diff = 100 - pcts.reduce((a, b) => a + b, 0);
  pcts[0] += diff;
  // Compute dasharray & dashoffset
  const segments = [];
  let offset = 25; // start at top
  for (let i = 0; i < n; i++) {
    segments.push({ pct: pcts[i], dash: `${pcts[i]} ${100 - pcts[i]}`, offset });
    offset = (offset - pcts[i] + 100) % 100;
  }
  return segments;
}

// ── Palette state keyed by index ──
const state = PALETTES.map(p => ({ ...p, colors: p.colors.map(c => ({ ...c })) }));

function renderAll() {
  const container = document.getElementById('palettes');
  container.innerHTML = '';
  state.forEach((p, i) => container.appendChild(buildSection(p, i)));
}

function buildSection(p, idx) {
  const section = document.createElement('div');
  section.className = 'palette-section';
  section.dataset.pidx = idx;

  const accentCount = p.colors.length - 1;

  // ── Header ──
  const header = document.createElement('div');
  header.className = 'palette-header';
  header.innerHTML = `
    <div class="palette-number">${idx + 1}</div>
    <input class="palette-name-input" value="${p.name}" spellcheck="false"/>
    <div class="palette-count-badge">${p.colors.length} couleurs</div>
  `;
  header.querySelector('.palette-name-input').addEventListener('input', e => { p.name = e.target.value; });
  section.appendChild(header);

  // ── Swatch row + buttons ──
  const wrapper = document.createElement('div');
  wrapper.className = 'swatch-wrapper';

  const row = document.createElement('div');
  row.className = 'palette-row';
  p.colors.forEach((c, ci) => {
    const block = document.createElement('div');
    block.className = 'color-block' + (lum(c.hex) > 160 ? ' dark-text' : '');
    block.style.background = c.hex;
    if (ci === 0) block.style.flex = '1.6';
    block.innerHTML = `
      <input type="color" value="${c.hex}" data-cidx="${ci}">
      <span class="click-hint">modifier</span>
      <span class="color-label">${c.label}</span>
      <span class="color-hex">${c.hex.toUpperCase()}</span>
    `;
    block.querySelector('input').addEventListener('input', function() {
      const ci2 = parseInt(this.dataset.cidx);
      p.colors[ci2].hex = this.value;
      applyColor(section, ci2, this.value, p);
    });
    row.appendChild(block);
  });
  wrapper.appendChild(row);

  const controls = document.createElement('div');
  controls.className = 'swatch-controls';

  const shuffleBtn = document.createElement('button');
  shuffleBtn.className = 'swatch-btn';
  shuffleBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6"/><path d="M2.5 22v-6h6"/><path d="M21.5 8A10 10 0 0 0 5.3 5.3L2.5 8"/><path d="M2.5 16a10 10 0 0 0 16.2 2.7l2.8-2.7"/></svg>';
  shuffleBtn.title = 'R\u00e9organiser les couleurs';
  shuffleBtn.disabled = p.colors.length <= MIN_COLORS;
  shuffleBtn.addEventListener('click', () => {
    // Fisher-Yates shuffle on accent colors only (keep primary at index 0)
    const accents = p.colors.slice(1);
    for (let i = accents.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [accents[i], accents[j]] = [accents[j], accents[i]];
    }
    p.colors = [p.colors[0], ...accents];
    rebuildSection(idx);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'swatch-btn';
  addBtn.innerHTML = '+';
  addBtn.title = 'Ajouter une couleur';
  addBtn.disabled = p.colors.length >= MAX_COLORS;
  addBtn.addEventListener('click', () => {
    if (p.colors.length >= MAX_COLORS) return;
    const newLabel = DEFAULT_NEW_LABELS[p.colors.length - 1] || 'Accent ' + p.colors.length;
    p.colors.push({ hex: randHex(), label: newLabel });
    rebuildSection(idx);
  });

  const removeBtn = document.createElement('button');
  removeBtn.className = 'swatch-btn';
  removeBtn.innerHTML = '&minus;';
  removeBtn.title = 'Retirer la derni\u00e8re couleur';
  removeBtn.disabled = p.colors.length <= MIN_COLORS;
  removeBtn.addEventListener('click', () => {
    if (p.colors.length <= MIN_COLORS) return;
    p.colors.pop();
    rebuildSection(idx);
  });

  controls.appendChild(shuffleBtn);
  controls.appendChild(addBtn);
  controls.appendChild(removeBtn);
  wrapper.appendChild(controls);
  section.appendChild(wrapper);

  // ── Preview row ──
  const preview = buildPreview(p);
  section.appendChild(preview);

  // ── Export bar ──
  const exportBar = document.createElement('div');
  exportBar.className = 'export-bar';
  const codeEl = document.createElement('code');
  codeEl.textContent = p.colors.map(c => c.hex.toUpperCase()).join('  ');
  const copyBtn = document.createElement('button');
  copyBtn.className = 'export-btn';
  copyBtn.textContent = 'Copier les hex';
  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(p.colors.map(c => c.hex.toUpperCase()).join('  ')).then(() => {
      copyBtn.textContent = 'Copi\u00e9 !'; copyBtn.classList.add('copied');
      setTimeout(() => { copyBtn.textContent = 'Copier les hex'; copyBtn.classList.remove('copied'); }, 1500);
    });
  });
  exportBar.appendChild(codeEl);
  exportBar.appendChild(copyBtn);
  section.appendChild(exportBar);

  return section;
}

function buildPreview(p) {
  const accents = p.colors.slice(1);
  const n = accents.length;
  const preview = document.createElement('div');
  preview.className = 'preview-grid';

  // ── Dark slide (stats) ──
  const statCount = Math.min(n, 4);
  const dark = document.createElement('div');
  dark.className = 'mini-slide';
  dark.dataset.role = 'dark';
  dark.style.cssText = `background:${p.colors[0].hex}; color:${textOnBg(p.colors[0].hex)};`;
  let dh = '<div class="mini-slide-header"><h3>Slide sombre</h3><p>' + n + ' accent' + (n > 1 ? 's' : '') + '</p></div><div class="mini-slide-body"><div class="mini-stat-row">';
  for (let i = 0; i < statCount; i++) {
    const hex = accents[i].hex;
    dh += `<div class="mini-stat" data-cidx="${i+1}" data-role="stat-bg" style="background:${rgba(hex,.15)}">
      <div class="mini-stat-value" data-cidx="${i+1}" data-role="stat-val" style="color:${hex}">${STAT_VALUES[i]}</div>
      <div class="mini-stat-label" data-cidx="${i+1}" data-role="stat-lbl" style="color:${lighten(hex,50)}">${STAT_LABELS[i]}</div>
    </div>`;
  }
  dh += '</div></div>';
  dark.innerHTML = dh;
  preview.appendChild(dark);

  // ── Light slide (bars) ──
  const light = document.createElement('div');
  light.className = 'mini-slide';
  light.dataset.role = 'light';
  light.style.cssText = `background:white; color:${textOnLight(p.colors[0].hex)};`;
  let lh = '<div class="mini-slide-header"><h3>Slide claire</h3><p>Bar chart</p></div><div class="mini-slide-body">';
  for (let i = 0; i < n; i++) {
    const label = BAR_LABELS[i] || 'Canal ' + (i + 1);
    const w = BAR_WIDTHS_BASE[i] || (40 + Math.round(Math.random() * 40));
    lh += `<div class="mini-bar-row">
      <span class="mini-bar-label">${label}</span>
      <div class="mini-bar-track"><div class="mini-bar-fill" data-cidx="${i+1}" data-role="bar" style="width:${w}%;background:${accents[i].hex}"></div></div>
    </div>`;
  }
  lh += '</div>';
  light.innerHTML = lh;
  preview.appendChild(light);

  // ── Donut slide ──
  const segments = donutSegments(n);
  const donut = document.createElement('div');
  donut.className = 'mini-slide';
  donut.dataset.role = 'donut';
  donut.style.cssText = `background:#F8FAFC; color:${textOnLight(p.colors[0].hex)};`;
  let doh = '<div class="mini-slide-header"><h3>Donut chart</h3><p>' + n + ' segments</p></div><div class="mini-slide-body"><div class="mini-donut-row">';
  doh += '<svg width="90" height="90" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9" fill="none" stroke="#E8ECF0" stroke-width="5"/>';
  for (let i = 0; i < n; i++) {
    doh += `<circle cx="21" cy="21" r="15.9" fill="none" data-cidx="${i+1}" data-role="donut" stroke="${accents[i].hex}" stroke-width="5" stroke-dasharray="${segments[i].dash}" stroke-dashoffset="${segments[i].offset}"/>`;
  }
  doh += '</svg><div class="mini-legend">';
  for (let i = 0; i < n; i++) {
    doh += `<div class="mini-legend-item"><div class="mini-legend-dot" data-cidx="${i+1}" data-role="dot" style="background:${accents[i].hex}"></div><span data-cidx="${i+1}" data-role="legend-text">${accents[i].label} ${segments[i].pct}%</span></div>`;
  }
  doh += '</div></div></div>';
  donut.innerHTML = doh;
  preview.appendChild(donut);

  // ── Stacked horizontal bars ──
  const stacked = document.createElement('div');
  stacked.className = 'mini-slide';
  stacked.dataset.role = 'stacked';
  stacked.style.cssText = `background:white; color:${textOnLight(p.colors[0].hex)};`;
  let sh = '<div class="mini-slide-header"><h3>Barres empil\u00e9es</h3><p>Segments combin\u00e9s</p></div><div class="mini-slide-body">';
  const stackLabels = ['Q1','Q2','Q3','Q4','Q5'];
  for (let r = 0; r < Math.min(5, n + 1); r++) {
    const segs = [];
    let remaining = 100;
    for (let i = 0; i < n; i++) {
      const w = (i < n - 1) ? Math.max(8, Math.round((Math.random() * 0.4 + 0.3) * remaining / (n - i))) : remaining;
      segs.push(w);
      remaining -= w;
    }
    sh += `<div class="stacked-row"><span class="stacked-label">${stackLabels[r] || 'R' + (r+1)}</span><div class="stacked-track">`;
    for (let i = 0; i < n; i++) {
      sh += `<div class="stacked-seg" data-cidx="${i+1}" data-role="stacked-seg" style="width:${segs[i]}%;background:${accents[i].hex}"></div>`;
    }
    sh += '</div></div>';
  }
  sh += '</div>';
  stacked.innerHTML = sh;
  preview.appendChild(stacked);

  // ── Radar chart ──
  const radar = document.createElement('div');
  radar.className = 'mini-slide';
  radar.dataset.role = 'radar';
  radar.style.cssText = `background:${p.colors[0].hex}; color:${textOnBg(p.colors[0].hex)};`;
  const axes = Math.max(n, 4);
  const R = 65;
  const cx = 80, cy = 78;
  function polarXY(angle, r) { return { x: cx + r * Math.cos(angle - Math.PI/2), y: cy + r * Math.sin(angle - Math.PI/2) }; }
  let rh = '<div class="mini-slide-header"><h3>Radar chart</h3><p>' + axes + ' axes</p></div><div class="mini-slide-body"><div class="radar-wrap">';
  rh += `<svg width="160" height="156" viewBox="0 0 160 156">`;
  // Grid rings — adapt to background luminance
  const radarGridColor = lum(p.colors[0].hex) < 140 ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
  const radarAxisColor = lum(p.colors[0].hex) < 140 ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.12)';
  for (let ring = 1; ring <= 4; ring++) {
    const rr = R * ring / 4;
    let pts = [];
    for (let a = 0; a < axes; a++) { const p2 = polarXY(a * 2 * Math.PI / axes, rr); pts.push(`${p2.x.toFixed(1)},${p2.y.toFixed(1)}`); }
    rh += `<polygon points="${pts.join(' ')}" fill="none" data-role="radar-grid" stroke="${radarGridColor}" stroke-width="0.6"/>`;
  }
  // Axis lines
  for (let a = 0; a < axes; a++) {
    const p2 = polarXY(a * 2 * Math.PI / axes, R);
    rh += `<line x1="${cx}" y1="${cy}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}" data-role="radar-axis" stroke="${radarAxisColor}" stroke-width="0.5"/>`;
  }
  // Data polygons (up to 3 series using first 3 accents)
  const seriesCount = Math.min(n, 3);
  for (let s = 0; s < seriesCount; s++) {
    let pts = [];
    for (let a = 0; a < axes; a++) {
      const val = 0.35 + Math.random() * 0.55;
      const p2 = polarXY(a * 2 * Math.PI / axes, R * val);
      pts.push(`${p2.x.toFixed(1)},${p2.y.toFixed(1)}`);
    }
    rh += `<polygon data-cidx="${s+1}" data-role="radar-fill" points="${pts.join(' ')}" fill="${rgba(accents[s].hex, 0.25)}" stroke="${accents[s].hex}" stroke-width="1.5"/>`;
  }
  // Axis dots
  for (let a = 0; a < axes; a++) {
    const p2 = polarXY(a * 2 * Math.PI / axes, R + 8);
    const ci = (a % n);
    rh += `<circle cx="${p2.x.toFixed(1)}" cy="${p2.y.toFixed(1)}" r="2.5" fill="${accents[ci].hex}" data-cidx="${ci+1}" data-role="radar-dot"/>`;
  }
  rh += '</svg></div></div>';
  radar.innerHTML = rh;
  preview.appendChild(radar);

  // ── Heatmap grid ──
  const heatmap = document.createElement('div');
  heatmap.className = 'mini-slide';
  heatmap.dataset.role = 'heatmap';
  heatmap.style.cssText = `background:white; color:${textOnLight(p.colors[0].hex)};`;
  const heatRows = 5;
  const opacities = [0.15, 0.3, 0.5, 0.75, 1.0];
  const opLabels = ['20%','40%','60%','80%','100%'];
  let hh = '<div class="mini-slide-header"><h3>Heatmap</h3><p>Intensit\u00e9 par couleur</p></div><div class="mini-slide-body">';
  hh += `<div class="heatmap-grid" style="grid-template-columns: 24px repeat(${n}, 1fr); grid-template-rows: auto repeat(${heatRows}, 1fr);">`;
  // Column headers
  hh += '<div></div>';
  for (let c = 0; c < n; c++) {
    hh += `<div class="heatmap-col-label">${accents[c].label.slice(0, 5)}</div>`;
  }
  // Rows
  for (let r = 0; r < heatRows; r++) {
    hh += `<div class="heatmap-row-label">${opLabels[r]}</div>`;
    for (let c = 0; c < n; c++) {
      hh += `<div class="heatmap-cell" data-cidx="${c+1}" data-role="heat" data-opacity="${opacities[r]}" style="background:${rgba(accents[c].hex, opacities[r])}; border-radius:3px;"></div>`;
    }
  }
  hh += '</div></div>';
  heatmap.innerHTML = hh;
  preview.appendChild(heatmap);

  return preview;
}

function rebuildSection(idx) {
  const container = document.getElementById('palettes');
  const oldSection = container.querySelector(`[data-pidx="${idx}"]`);
  const newSection = buildSection(state[idx], idx);
  container.replaceChild(newSection, oldSection);
}

function applyColor(section, ci, hex, p) {
  // Update swatch
  const blocks = section.querySelectorAll('.color-block');
  if (blocks[ci]) {
    blocks[ci].style.background = hex;
    blocks[ci].querySelector('.color-hex').textContent = hex.toUpperCase();
    blocks[ci].classList.toggle('dark-text', lum(hex) > 160);
  }

  // Update export code
  const codeEl = section.querySelector('.export-bar code');
  if (codeEl) codeEl.textContent = p.colors.map(c => c.hex.toUpperCase()).join('  ');

  // Update count badge
  const badge = section.querySelector('.palette-count-badge');
  if (badge) badge.textContent = p.colors.length + ' couleurs';

  if (ci === 0) {
    // Primary color: update dark-bg slides (background + adaptive text)
    section.querySelectorAll('[data-role="dark"], [data-role="radar"]').forEach(el => {
      el.style.background = hex;
      el.style.color = textOnBg(hex);
    });
    // Light-bg slides: adaptive text color (use primary if dark enough, else fallback)
    section.querySelectorAll('[data-role="light"], [data-role="donut"], [data-role="stacked"], [data-role="heatmap"]').forEach(el => {
      el.style.color = textOnLight(hex);
    });
    // Radar grid/axis lines adapt to background
    const gridC = lum(hex) < 140 ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
    const axisC = lum(hex) < 140 ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.12)';
    section.querySelectorAll('[data-role="radar-grid"]').forEach(el => el.setAttribute('stroke', gridC));
    section.querySelectorAll('[data-role="radar-axis"]').forEach(el => el.setAttribute('stroke', axisC));
    return;
  }

  section.querySelectorAll(`[data-cidx="${ci}"]`).forEach(el => {
    if (el.tagName === 'INPUT') return;
    const role = el.dataset.role;
    if (role === 'stat-bg') el.style.background = rgba(hex, .15);
    else if (role === 'stat-val') el.style.color = hex;
    else if (role === 'stat-lbl') el.style.color = lighten(hex, 50);
    else if (role === 'bar' || role === 'stacked-seg') el.style.background = hex;
    else if (role === 'donut') el.setAttribute('stroke', hex);
    else if (role === 'dot') el.style.background = hex;
    else if (role === 'radar-fill') { el.setAttribute('fill', rgba(hex, 0.25)); el.setAttribute('stroke', hex); }
    else if (role === 'radar-dot') el.setAttribute('fill', hex);
    else if (role === 'heat') el.style.background = rgba(hex, parseFloat(el.dataset.opacity));
  });
}

// ── Init ──
renderAll();
</script>
